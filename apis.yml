aid: satisfi-labs
name: Satisfi Labs
description: >-
  Satisfi Labs is an agentic AI platform for the sports, entertainment, and
  tourism industries, delivering specialized conversational AI agents that are
  built and tuned by industry experts to sell more tickets, scale guest support,
  improve the fan and visitor experience, and collect first-party customer data.
  The platform centers on an AI Agent Engine (content management, response types,
  enrichments, and generated responses trained on a customer's own website and
  documents), a Live Agent Engine for human handoff, and a Marketing Engine, with
  channel deployment across web, SMS, WhatsApp, Facebook Messenger, and email and
  integrations into ticketing (Ticketmaster, SeatGeek, FEVO, Ventrata, ParkWhiz),
  commerce (Shopify, WordPress), and automation (Zapier, Salesforce) systems.
  Clients include MLB, the Tampa Bay Buccaneers, Houston Astros, Atlanta Braves,
  Orlando Magic, and Georgia Tech Athletics. Satisfi Labs is a Techstars-backed
  company. This profile is maintained by API Evangelist; the company exposes a
  customer application and help center rather than a documented public developer API.
